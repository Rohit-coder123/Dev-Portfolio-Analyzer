server:
  port: 8080

spring:
  application:
    name: developer-portfolio-analyzer

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio_analyzer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Use "validate" once schema.sql has been applied manually (recommended for
      # a "production-ready" setup). Use "update" only for quick local iteration.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: never   # schema.sql is applied manually via database/schema.sql

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ---------------------------------------------------------------------------
# GitHub API configuration
# ---------------------------------------------------------------------------
github:
  api:
    base-url: https://api.github.com
    # Personal Access Token (classic, no scopes needed for public data) raises
    # the rate limit from 60/hr (unauthenticated) to 5000/hr.
    # Set via environment variable — never commit a real token.
    token: ${GITHUB_API_TOKEN:}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-repos-fetched: 100
    max-events-fetched: 300

# ---------------------------------------------------------------------------
# Scoring engine tunables (kept out of code so they can be re-tuned without
# a redeploy of core logic)
# ---------------------------------------------------------------------------
scoring:
  weights:
    commit-consistency: 0.30
    repository-quality: 0.20
    code-impact: 0.20
    tech-diversity: 0.15
    recent-activity: 0.15
  consistency-window-weeks: 12
  tech-diversity-cap-languages: 8
  code-impact-benchmark: 1000
  recent-activity-decay-days: 45

logging:
  level:
    root: INFO
    com.portfolioanalyzer: DEBUG
