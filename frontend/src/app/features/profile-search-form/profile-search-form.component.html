<form
  class="flex flex-col sm:flex-row items-start sm:items-center gap-3"
  (ngSubmit)="submit()"
>
  <mat-form-field appearance="outline" class="flex-1 w-full sm:w-auto search-field">
    <mat-label>GitHub username</mat-label>
    <input
      matInput
      [formControl]="usernameControl"
      placeholder="e.g. torvalds"
      autocomplete="off"
      (keydown.enter)="submit()"
    />
    @if (usernameControl.hasError('required') && usernameControl.touched) {
      <mat-error>Enter a GitHub username to analyze.</mat-error>
    }
    @if (usernameControl.hasError('pattern') && usernameControl.touched) {
      <mat-error>That doesn't look like a valid GitHub username.</mat-error>
    }
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="analyze-btn"
    [disabled]="loading"
  >
    @if (loading) {
      <mat-spinner diameter="20" class="inline-spinner" />
      <span class="ml-2">Analyzing…</span>
    } @else {
      <mat-icon class="mr-1">insights</mat-icon>
      <span>Analyze profile</span>
    }
  </button>
</form>
